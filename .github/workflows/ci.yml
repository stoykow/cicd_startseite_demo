name: Startseite CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: PHP syntax check
        run: find . -path './.git' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Content smoke checks
        run: |
          test -f .env.example
          test ! -f .env
          grep -q "Impressum" impressum_example.php
          grep -q "Datenschutz" datenschutz_example.php
          grep -q "legal.css" impressum_example.php
          grep -q "legal.css" datenschutz_example.php

      - name: Secret leak check
        run: |
          if grep -R --exclude="README.md" --exclude=".env.example" --exclude=".gitlab-ci.yml" --exclude-dir=".github" --exclude-dir=".git" "MARIADB_ROOT_PASSWORD=" .; then
            echo "Geheimer Datenbankwert im Repository gefunden."
            exit 1
          fi

  deploy:
    name: Optional FTP/SFTP deploy
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    env:
      STARTSEITE_DEPLOY_METHOD: ftps
      STARTSEITE_DEPLOY_PORT: '21'
      STARTSEITE_DEPLOY_PATH: /
      STARTSEITE_DEPLOY_CONNECT_TIMEOUT: '30'
      STARTSEITE_DEPLOY_TIMEOUT: '180'
      STARTSEITE_DB_HOST: localhost
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install deploy tools
        run: sudo apt-get update && sudo apt-get install -y lftp openssh-client sshpass

      - name: Create deployed PHP config
        env:
          DB_HOST: ${{ env.STARTSEITE_DB_HOST }}
          DB_NAME: ${{ secrets.MARIADB_DATABASE }}
          DB_USER: ${{ secrets.MARIADB_USER }}
          DB_PASS: ${{ secrets.MARIADB_PASSWORD }}
        run: |
          set -eu

          test -n "$DB_HOST"
          test -n "$DB_NAME"
          test -n "$DB_USER"
          test -n "$DB_PASS"

          php -r '
          $config = [
              "DB_HOST" => getenv("DB_HOST"),
              "DB_NAME" => getenv("DB_NAME"),
              "DB_USER" => getenv("DB_USER"),
              "DB_PASS" => getenv("DB_PASS"),
          ];
          file_put_contents("config/local.php", "<?php\nreturn " . var_export($config, true) . ";\n");
          '

      - name: Create demo legal pages
        env:
          LEGAL_IMPRESSUM_PHP: ${{ secrets.LEGAL_IMPRESSUM_PHP }}
          LEGAL_DATENSCHUTZ_PHP: ${{ secrets.LEGAL_DATENSCHUTZ_PHP }}
        run: |
          if [ -n "${LEGAL_IMPRESSUM_PHP:-}" ] && [ -n "${LEGAL_DATENSCHUTZ_PHP:-}" ]; then
            printf '%s' "$LEGAL_IMPRESSUM_PHP" > impressum.php
            printf '%s' "$LEGAL_DATENSCHUTZ_PHP" > datenschutz.php
          else
            cp impressum_example.php impressum.php
            cp datenschutz_example.php datenschutz.php
          fi

      - name: Deploy via FTP, FTPS or SFTP
        env:
          DEPLOY_METHOD: ${{ env.STARTSEITE_DEPLOY_METHOD }}
          DEPLOY_HOST: ${{ vars.STARTSEITE_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ env.STARTSEITE_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.STARTSEITE_DEPLOY_USER }}
          DEPLOY_PATH: ${{ env.STARTSEITE_DEPLOY_PATH }}
          DEPLOY_CONNECT_TIMEOUT: ${{ env.STARTSEITE_DEPLOY_CONNECT_TIMEOUT }}
          DEPLOY_TIMEOUT: ${{ env.STARTSEITE_DEPLOY_TIMEOUT }}
          DEPLOY_PASSWORD: ${{ secrets.STARTSEITE_DEPLOY_PASSWORD }}
        run: |
          set -eu

          METHOD="${DEPLOY_METHOD:-ftps}"
          HOST="${DEPLOY_HOST:?STARTSEITE_DEPLOY_HOST fehlt}"
          USER="${DEPLOY_USER:?STARTSEITE_DEPLOY_USER fehlt}"
          PASSWORD="${DEPLOY_PASSWORD:?STARTSEITE_DEPLOY_PASSWORD fehlt}"
          TARGET_PATH="${DEPLOY_PATH:-/}"
          CONNECT_TIMEOUT="${DEPLOY_CONNECT_TIMEOUT:-30}"
          TIMEOUT="${DEPLOY_TIMEOUT:-180}"

          case "$METHOD" in
            ftp|ftps)
              PORT="${DEPLOY_PORT:-21}"
              SSL_FORCE="false"
              if [ "$METHOD" = "ftps" ]; then
                SSL_FORCE="true"
              fi

              lftp -u "$USER","$PASSWORD" -p "$PORT" "$HOST" <<EOF
          set net:connect-timeout $CONNECT_TIMEOUT
          set net:timeout $TIMEOUT
          set net:max-retries 1
          set ftp:ssl-force $SSL_FORCE
          set ftp:ssl-protect-data $SSL_FORCE
          set ssl:verify-certificate no
          mirror --reverse --verbose --delete \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob .env \
            --exclude-glob .gitlab-ci.yml \
            --exclude-glob docker-compose.yml \
            ./ "$TARGET_PATH"
          bye
          EOF
              ;;

            sftp)
              PORT="${DEPLOY_PORT:-22}"
              tar \
                --exclude='.git/' \
                --exclude='.github/' \
                --exclude='.env' \
                --exclude='.gitlab-ci.yml' \
                --exclude='docker-compose.yml' \
                -czf - . \
              | SSHPASS="$PASSWORD" sshpass -e ssh \
                -o StrictHostKeyChecking=accept-new \
                -o ConnectTimeout="$CONNECT_TIMEOUT" \
                -o ServerAliveInterval=30 \
                -o ServerAliveCountMax=4 \
                -p "$PORT" \
                "$USER@$HOST" \
                "mkdir -p '$TARGET_PATH' && tar -xzf - -C '$TARGET_PATH'"
              ;;

            *)
              echo "Unbekannte Deployment-Methode: $METHOD"
              echo "Erlaubt sind: ftp, ftps, sftp"
              exit 1
              ;;
          esac

  smoke:
    name: Optional public smoke test
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check public pages
        env:
          STARTSEITE_PUBLIC_URL: ${{ vars.STARTSEITE_PUBLIC_URL }}
        run: |
          set -eu

          BASE_URL="${STARTSEITE_PUBLIC_URL:?STARTSEITE_PUBLIC_URL fehlt}"
          BASE_URL="${BASE_URL%/}"

          check_page() {
            path="$1"
            expected="$2"
            url="$BASE_URL/$path"

            echo "Prüfe $url"
            curl -fsSL --max-time 20 "$url" -o response.html
            grep -q "$expected" response.html
          }

          check_page "impressum.php" "Impressum"
          check_page "datenschutz.php" "Datenschutz"
